spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spring_ai_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update

  lifecycle:
    timeout-per-shutdown-phase: 30s

  sql:
    init:
      mode: always

  docker:
    compose:
      enabled: false
      lifecycle-management: start_and_stop
      stop:
        command: down
      file: docker-compose.yml

  main:
    allow-bean-definition-overriding: true

  application:
    name: mcp-service

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-ada-002
      chat:
        options:
          model: gpt-4o
          temperature: 1
    vectorstore:
      qdrant:
        initialize-schema: true
        host: ${SPRING_AI_VECTORSTORE_QDRANT_HOST:localhost}
        port: ${SPRING_AI_VECTORSTORE_QDRANT_PORT:6334}
        collection-name: spring-ai-collection

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"
  level:
    org.springframework.ai.chat.client.advisor: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0
  observations:
    key-values:
      spring.ai.chat.observations.include-prompt: true
  prometheus:
    metrics:
      export:
        # Correct property for SB 3.3.x to disable exemplars
        exemplars:
          enabled: false
  otlp:
    tracing:
      # Use HTTP on port 4318 with the standard /v1/traces path
      endpoint: ${SPRING_AI_OTEL_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
