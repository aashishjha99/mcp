plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.aashish'
version = '0.0.1-SNAPSHOT'
description = 'Spring AI project'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "1.0.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'

    implementation "org.springframework.ai:spring-ai-model-chat-memory-repository-jdbc"
    implementation "org.springframework.ai:spring-ai-rag"
    implementation "org.springframework.ai:spring-ai-starter-vector-store-qdrant"
    implementation "org.springframework.ai:spring-ai-advisors-vector-store"
    testImplementation 'org.junit.jupiter:junit-jupiter'
    runtimeOnly 'com.mysql:mysql-connector-j' // MySQL JDBC driver
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation("org.springframework.boot:spring-boot-starter-data-jpa")

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation("org.springframework.ai:spring-ai-tika-document-reader")

    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    // Source: https://mvnrepository.com/artifact/org.springframework.ai/spring-ai-mcp
    implementation("org.springframework.ai:spring-ai-starter-mcp-client")

    // optional (safe)
    //developmentOnly 'org.springframework.boot:spring-boot-devtools'
   // implementation('org.apache.httpcomponents.client5:httpclient5')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    enabled=false
}
